    <style>
    html * {
    font-size: 0.97em !important;
    }

    .quizBox {
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        text-align: center;
        width: 97%;
        margin: auto;

    }

    .btn {
        padding: 9px;
    }

    .btn-light {
        background-color: #EFEFEF;
    }

    .btn,
    .btn-block {
        padding-left: 4.8%;
        padding-right: 4.8%;
        margin: auto;
        white-space: normal;
    }



    div {
        padding-bottom: 8px;
        padding-top: 8px;
    }
    .question {
        padding-top: 10px;
    }

    .quizBox {
        margin-bottom: 20px;
    }
    .feedback {
        font-weight: bold;
        font-size: 1.7em;
        display:none;
    }
    .makeOpaque {
        opacity: 0.7;
    }
    .btn-success, .btn-success:focus {
        background: linear-gradient(
        to right, 
        #198754 0%, 
        #198754 5%, 
        #EFF4EF 5%, 
        #EFF4EF  95%,
        #198754 95%,
        #198754 100%
    );
    color:black;
    outline: none !important;
    border: 0px;
    }

    .btn-secondary, .btn-secondary:focus {
        background: linear-gradient(
        to right, 
        #adb5bd 0%, 
        #adb5bd 5%, 
        #EFEFEF 5%, 
        #EFEFEF  95%,
        #adb5bd 95%,
        #adb5bd 100%
    );
    color:black;
    outline: none !important;
    border: 0px;
    }

    .btn-danger, .btn-danger:focus {
        background: linear-gradient(
        to right, 
        #dc3545 0%, 
        #dc3545 5%, 
        #F4EFEF 5%, 
        #F4EFEF  95%,
        #dc3545 95%,
        #dc3545 100%
    );
    color:black;
    outline: none !important;
    border: 0px;
    }


    .btn-warning, .btn-warning:focus {

        to right, 
        #ffc107 0%, 
        #ffc107 5%, 
        #EFEFEA 5%, 
        #EFEFEA  95%,
        #ffc107 95%,
        #ffc107 100%
    );
        color:black;
        outline: none !important;
        border: 0px;

    .btn:focus,.btn:active:focus,.btn.active:focus,

var RIGHTS={"Algoritmul Bresenham generalizat: Fie vectorul (8,11)->(14,3). Din ce octant face parte vectorul? Care este numărul de pixeli prin care este\naproximat vectorul?":{rights:["Vectorul face parte din octantul 7 iar numărul de pixeli prin care este aproximat este 9"],wrongs:["Vectorul face parte din octantul 7 iar numărul de pixeli prin care este aproximat este 7","Vectorul face parte din octantul 2 iar numărul de pixeli prin care este aproximat este 7","Vectorul face parte din octantul 2 iar numărul de pixeli prin care este aproximat este 9"],nrRights:1,nrWrongs:3},"Arborele octal al unei scene 3D:":{rights:["Se obtine divizand recursiv cubul incadrator al scenei in 8 subvolume egale pana cand fiecare subvolum contine o primitiva sau un numar prestabilit de primitive.","Nu este eficient atunci cand primitivele apartin mai multor subvolume adiacente."],wrongs:["Este folosit pentru eliminarea suprafetelor obturate.","Este construit pe GPU dupa asamblarea primitivelor."],nrRights:2,nrWrongs:2},"Care dintre urmatoarele metode tin cont de normalele la planele poligoanelor:":{rights:["Eliminarea fetelor auto-obturate ale obiectelor","Algoritmul BSP"],wrongs:["Algoritmul z-buffer","Algoritmul BVH"],nrRights:2,nrWrongs:2},"Care dintre urmatoarele operatii sunt efectuate pe GPU:":{rights:["Decuparea primitivelor care intersecteaza volumul vizual.","Testul de vizibilitate la nivel de fragment (z-buffer).","Eliminarea fetelor auto-obturate ale obiectelor"],wrongs:["Determinarea partilor suprafetelor 3D obturate de alte suprafete."],nrRights:3,nrWrongs:1},"Care dintre urmatoarele operatii tin cont de pozitia observatorului:":{rights:["Testul de vizibilitate z-buffer","Eliminarea fetelor auto-obturate ale obiectelor","Afisarea folosind BSP"],wrongs:["Construirea arborelui AA-BSP al scenei"],nrRights:3,nrWrongs:1},"Care dintre urmatoarele operaṭii sunt implementate intr-un motor grafic:":{rights:["Algoritmul BSP","Eliminare obiecte sau grupuri de obiecte care nu sunt incluse în volumul vizual (Frustum culling)"],wrongs:["Algoritmul Z-buffer","Decuparea primitivelor la marginile volumului vizual."],nrRights:2,nrWrongs:2},"Care dintre urmatoarele transformari geometrice 2D poate modifica forma unui obiect?":{rights:["Forfecarea","Scalarea"],wrongs:["Rotația","Translația"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii despre proiectia perspectiva sunt corecte ?":{rights:["Modifica lungimile laturilor in functie de distanta lor fata de centrul de proiectie","Modifica unghiurile dintre laturile care nu sunt paralele cu planul de proiectie"],wrongs:["Produce coordonate omogene in care coordonata w este egala cu 1","Este o transformare afina"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii despre proiectiile izometrice sunt corecte ?":{rights:["Sunt proiectii axonometrice care produc scalarea laturilor cu factori de scalare egali pe axele x, y, z","Sunt proiectii axonometrice intr-un plan care intersecteaza axele principale ale sistemului de coordonate cu unghiuri egale"],wrongs:["Sunt proiectii axonometrice in planul XOY"],nrRights:2,nrWrongs:1},"Care dintre următoarele afirmaṭii despre proiectiile oblice sunt corecte?":{rights:["Conserva lungimile laturilor paralele cu planul de proiectie si unghiurile dintre aceste laturi","Nu pot fi definite prin transformarea de proiectie OpenGL","Conserva lungimea laturilor perpendiculare pe planul de proiectie daca unghiul dintre proiectori si plan este de 45 grade"],wrongs:["Sunt proiectii intr-un plan care nu este perpendicular pe o axa principala"],nrRights:3,nrWrongs:1},"Care dintre următoarele afirmaṭii sunt corecte dacă se aplică modelul de shading Gouraud?":{rights:["Culorile fragmentelor unei primitive sunt calculate prin interpolarea culorilor din vârfurile primitivei","Culoarea fiecărui fragment este calculată de GPU"],wrongs:["Poate fi redată reflexia speculară pe suprafaṭa unei primitive","Culoarea unui fragment se calculează în fragment shader folosind un model de iluminare locală"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte dacă se aplică modelul de shading Phong ?":{rights:["Culoarea unui fragment se calculează în fragment shader folosind normala fragmentului","Se poate calcula componenta speculară a reflexiei luminii într-un fragment al unei primitive"],wrongs:["Normala unui fragment se poate calcula în fragment shader prin interpolarea normalelor vârfurilor","Culorile fragmentelor sunt calculate automat de GPU"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte privind transformarea de proiecṭie din lanṭul de transformare a vârfurilor în banda grafică ?":{rights:["Transformă coordonatele din sistemul de coordonate observator în sistemul coordonatelor de decupare","Depinde de volumul vizual definit de programator"],wrongs:["Este o proiectie din 3D în 2D","Transformă coordonatele din sistemul de coordonate observator în sistemul de coordonate dispozitiv normalizate"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte privind transformarea în poarta de afişare ?":{rights:["Depinde numai de poziṭia porṭii de afişare în fereastra aplicaṭiei, lăṭimea şi înălṭimea sa măsurate în pixeli","Transforma varfurile din coordonate dispozitiv normalizate în coordonate ecran"],wrongs:["Transformă coordonate 3D în coordonate 2D","Depinde numai de poziṭia porṭii de afişare în spaṭiul ecran, lăṭimea şi înălṭimea sa măsurate în pixeli"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte privind volumul vizual canonic ?":{rights:["Este folosit pentru optimizarea calculelor de decupare a primitivelor 3D","Este un cub cu latura de 2 unităṭi, raportat la sistemul coordonatelor de decupare"],wrongs:["Depinde de tipul de proiecṭie definit prin transformarea de proiecṭie","Este definit în sistemul coordonatelor observator"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte referitor la arborele BSP:":{rights:["La afişarea “din spate în faṭă” poate fi dezactivat testul de adancime","La afişarea “din faṭă în spate” nu sunt suprascrise părṭile poligoanelor aflate mai departe de observator","Este eficient pentru afişarea scenelor care contin obiecte mari statice"],wrongs:["Trebuie reconstruit pentru fiecare cadru imagine"],nrRights:3,nrWrongs:1},'Care dintre următoarele afirmaṭii sunt corecte referitor la "Algoritmul pictorului":':{rights:["In cazul unor scene dinamice, lista ordonată a poligoanelor trebuie modificată pentru fiecare cadru imagine.","Rezolva eliminarea suprafetelor nevizibile printr-o afişare “din spate în faṭă” a poligoanelor scenei.","Este eficient pentru aplicatii in care poligoanele scenei sunt disjuncte pe axa Z."],wrongs:["Nu trimite în banda grafică poligoanele aflate în afara volumului vizual."],nrRights:3,nrWrongs:1},"Care dintre următoarele afirmaṭii sunt corecte referitor la Buffer-ul Z:":{rights:["Este actualizat pentru fiecare cadru imagine.","Memoreaza coordonatele z ale fragmentelor vizibile într-un cadru imagine."],wrongs:["Este actualizat pentru fiecare fragment rezultat din resterizarea unei primitive.","Memoreaza coordonatele z ale fragmentelor care nu trec testul de vizibilitate"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte referitor la algoritmul Z-buffer:":{rights:["Este integrat în procesul de rasterizare a primitivelor grafice","Realizează eliminarea din imagine a fragmentelor nevizibile"],wrongs:["Realizează eliminarea din imagine a feṭelor nevizibile","Se bazează pe o ordonare a primitivelor în ordinea descrescătoare a distanṭei lor faṭă de observator"],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte referitor la arborele BSP (PA-BSP) al unei scene:":{rights:["Se obṭine partiṭionând recursiv spaṭiul 3D în semispaṭii, folosind planele poligoanelor scenei 3D","Permite eliminarea din imagine a suprafeṭelor obturate şi efectuarea operatiei de “Frustum culling”"],wrongs:["Depinde de poziṭia observatorului"],nrRights:2,nrWrongs:1},"Care dintre următoarele afirmaṭii sunt corecte referitor la arborele BVH (Bounding Volume Hierarchy) al unei scene 3D:":{rights:["Arborele BVH este afectat de transformarile geometrice aplicate obiectelor din scenă.","Se elimină din banda grafică poligoanele dintr-un subarbore al cărui volum încadrator este în afara volumului vizual."],wrongs:["Permite decuparea primitivelor care intersecteaza volumul vizual.","Permite efectuarea operaṭiei de “Frustum culling” pe GPU."],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte referitor la structura BVH (Bounding Volume Hierarchy):":{rights:["Este un arbore care are în fiecare nod un volum încadrator pentru o primitivă grafică sau un grup de primitive.","Permite efectuarea eficientă a operaṭiei de „frustum culling” folosind volumele încadratoare ale nodurilor."],wrongs:["La construirea sa se ṭine cont de poziṭia observatorului în scena 3D.","Este independent de transformarile aplicate obiectelordin scena3D."],nrRights:2,nrWrongs:2},"Care dintre următoarele afirmaṭii sunt corecte? In modelul HSV:":{rights:["Culorile se reprezintă prin puncte 3D care aparṭin unui hexacon","Nuanṭele de gri se reprezintă prin combinaṭii S=0, 0<=V<=1","Culorile pure se află pe frontiera bazei hexaconului"],wrongs:["Culorile pure sunt situate pe suprafaṭa bazei hexaconului"],nrRights:3,nrWrongs:1},"Care dintre următoarele efecte nu se pot reda corect în fragmentele interioare primitivelor rasterizate, dacă se aplică modelul de shading\nGouraud:":{rights:["Reflexia speculară","Reflexia difuză"],wrongs:["Reflexia luminii ambientale","Factorul de atenuare a luminii de la sursă"],nrRights:2,nrWrongs:2},"Care dintre următoarele proiecṭii conservă lungimea laturilor perpendiculare pe planul de proiecṭie ?":{rights:["Cavalier"],wrongs:["Perspectivă","Cabinet","Axonometrică"],nrRights:1,nrWrongs:3},"Care dintre următoarele proiecṭii nu poate reda mai multe feṭe ale obiectului proiectat, dacă feṭele sunt paralele cu plan         function insertFilterButtons(chunkSize) {
            let questionsNumber = Object.keys(RIGHTS).length;

            let rowDiv = document.createElement("div")
            rowDiv.classList.add('row', "filterDiv");

            for (let i = 0; i < questionsNumber; i += chunkSize) {
                let intervalButton = document.createElement("button");
                intervalButton.classList.add("btn", "btn-light","col-4","mr-1", "filterButton");
                intervalButton.setAttribute("start", i);
                intervalButton.setAttribute("end", i + chunkSize < questionsNumber ? i + chunkSize : questionsNumber);

                intervalButton.textContent = (i + 1).toString() + "-" + (i + chunkSize < questionsNumber ? i + chunkSize : questionsNumber).toString()
                rowDiv.appendChild(intervalButton);
            }
            document.body.appendChild(rowDiv);
        }
        insertFilterButtons(10);


        function insertFilterButtonWrong() {
            let questionsNumber = Object.keys(WRONGS).length;

            let rowDiv = document.createElement("div")
            rowDiv.classList.add('row', "filterDiv");

            let intervalButton = document.createElement("button");
            intervalButton.classList.add("btn", "btn-warning", "filterButton", "filterWrong");
            intervalButton.setAttribute("start", 0);
            intervalButton.setAttribute("end", questionsNumber);
            intervalButton.textContent = "INCOMPLETE"
            rowDiv.appendChild(intervalButton);
            document.body.appendChild(rowDiv);
        }
        insertFilterButtonWrong();



        /* Returns an array of strings */
        function getShuffledQuestionKeys(idxStart, idxEnd) {
            /* since ES2015 strings are sorted chronologically,
             not alphabetically, so order is always preserved */
            let questionsKeys = Object.keys(RIGHTS);
            console.log(questionsKeys)
            if (idxStart !== undefined && idxEnd != undefined)
                questionsKeys = questionsKeys.slice(idxStart, idxEnd);
            return questionsKeys.sort((a, b) => 0.5 - Math.random());
        }

        /* Returns an array of strings */
        function getShuffledOptions(options) {
            return options
                .map(value => ({ value, sort: Math.random() }))
                .sort((a, b) => a.sort - b.sort)
                .map(({ value }) => value)
        }

        function insertQuestions(idxStart, idxEnd){
            let questionNumber = 1;
            getShuffledQuestionKeys(idxStart, idxEnd).forEach(questionText => {
                let quizBoxDiv = document.createElement('div')
                quizBoxDiv.classList.add('quizBox');
                quizBoxDiv.setAttribute('nrRights', RIGHTS[questionText].nrRights);
                quizBoxDiv.setAttribute('nrWrongs', RIGHTS[questionText].nrWrongs);
                quizBoxDiv.setAttribute('nrResponses', 0);
                quizBoxDiv.setAttribute('nrCorrect', 0);
                quizBoxDiv.classList.add("d-grid", "gap-1");

                let questionButton = document.createElement('p');
                questionButton.classList.add("question");

                if ('img' in RIGHTS[questionText]) {
                    questionButton.innerHTML=`${questionNumber.toString()}. ${questionText}<img src="${RIGHTS[questionText].img}">`
                } else {
                    questionButton.textContent = questionNumber.toString() + ". " + questionText;
                }

                questionNumber++;

                quizBoxDiv.appendChild(questionButton);

                let rights_wrongs = RIGHTS[questionText].rights;
                rights_wrongs = rights_wrongs.concat(RIGHTS[questionText].wrongs)
                getShuffledOptions(rights_wrongs).forEach(optionText => {
                    optionButton = document.createElement('button');
                    optionButton.classList.add("btn", "btn-light");
                    if (optionText.includes("data:image/")) {
                        optionButton.innerHTML = `<img src="${optionText}">`
                    } else {
                        optionButton.textContent = optionText;
                    }
                    quizBoxDiv.appendChild(optionButton);
                });
                feedback = document.createElement('h1');
                feedback.classList.add("feedback");
                quizBoxDiv.appendChild(feedback);
                document.body.appendChild(quizBoxDiv);
            });
        }
        insertQuestions();

        const onClick = (event) => {
            if (event.target.nodeName === 'BUTTON' && event.target.classList.contains("filterWrong")) {
                [].forEach.call(document.querySelectorAll('.quizBox'),function(e){
                        e.parentNode.removeChild(e);
                });
                insertWrongQuestions(0, Object.keys(WRONGS).length);
                return;
            }

            else if (event.target.nodeName === 'BUTTON' && event.target.classList.contains("filterButton")) {
                [].forEach.call(document.querySelectorAll('.quizBox'),function(e){
                        e.parentNode.removeChild(e);
                });
                insertQuestions(parseInt(event.target.getAttribute('start')), parseInt(event.target.getAttribute('end')));
                return;
            }


            else if (event.target.nodeName === 'BUTTON') {
                const parentNode = event.target.parentNode;
                if (parentNode.hasAttribute('alreadyAnswered'))
                    return;
                const currentButton = event.target;
                currentButton.setAttribute('style', "pointer-events:none");

                let currentResponses = parseInt(parentNode.getAttribute("nrResponses"));
                parentNode.setAttribute("nrResponses", currentResponses + 1);

                // If the last response was given
                if (parseInt(parentNode.getAttribute("nrResponses")) == parseInt(parentNode.getAttribute("nrRights"))) {
                    parentNode.setAttribute('alreadyAnswered', "true");
                    parentNode.scrollIntoView({
                        behavior: "smooth",
                        block: "start",
                        inline: "nearest"
                    });


                    // Determining the color of last clicked button. / red or green /
                    let questionText = parentNode.querySelector(":nth-child(1)").textContent.trim().split('. ').slice(1).join('. ');
                    
                    console.log(questionText);
                    let rightAnswers = RIGHTS[questionText].rights;
                    let responseText = currentButton.textContent;
                    if (rightAnswers.includes(responseText)) {
                        currentButton.setAttribute('colorTo', "btn-success");
                        let nrCorrectAnswered = parseInt(parentNode.getAttribute('nrCorrect'))
                        parentNode.setAttribute('nrCorrect', nrCorrectAnswered + 1)
                    } else {
                        currentButton.setAttribute('colorTo', "btn-danger");
                    }



                    // Feedback Component
                    let feedbackComponent = parentNode.querySelector('h1:last-child');
                    let percentageRight = (100 * parentNode.getAttribute('nrCorrect')) / parentNode.getAttribute('nrRights');
                    let percentageWrong = 100 - percentageRight;
                    feedbackComponent.outerHTML = `
                    <section class="progress" style=" height: 80%; margin-top: 3px; opacity: 0.9">
                        <section class="progress-bar" style="width: 1%; background: white"></section>
                        <section class="progress-bar-striped bg-success" style=" width: ${percentageRight * 0.99}%; text-align: center; color: white">${event.target.parentNode.getAttribute('nrCorrect')}</section>
                        <section class="progress-bar-striped bg-danger" style=" width: ${percentageWrong * 0.99}%; text-align: center; color: white">${event.target.parentNode.getAttribute('nrRights') - event.target.parentNode.getAttribute('nrCorrect')}</section>
                        <section class="progress-bar" style="width: 1%; background: white"></section>
                    </section>`;
                    feedbackComponent.setAttribute('style', "pointer-events:none");
                    


                    parentNode.querySelectorAll('button').forEach(option => {
                    option.setAttribute('style', "pointer-events:none");

                        if (option.getAttribute('colorTo')) {
                            option.classList.remove("btn-light");
                            option.classList.remove('btn-secondary')
                            option.classList.add(option.getAttribute('colorTo'));
                        }
                        else {
                            option.classList.remove('btn-light')
                            let optionText = option.textContent;
                            if (rightAnswers.includes(optionText)) {
                                option.classList.remove('null')
                                option.classList.remove('btn-light')
                                option.classList.add('btn-success', "makeOpaque")
                            }
                        }
                    })
                }

                if (parseInt(event.target.parentNode.getAttribute("nrResponses")) < parseInt(event.target.parentNode.getAttribute("nrRights"))) {
                    let questionText = event.target.parentNode.querySelector(":nth-child(1)").textContent.trim().split('. ').slice(1).join('. ');
                    let rightAnswers = RIGHTS[questionText].rights;

                    let responseText = event.target.textContent;
                    event.target.classList.remove("btn-light");
                    event.target.classList.add("btn-secondary");
                    if (rightAnswers.includes(responseText)) {
                        event.target.setAttribute('colorTo', "btn-success")
                        let nrCorrectAnswered = parseInt(event.target.parentNode.getAttribute('nrCorrect'))
                        event.target.parentNode.setAttribute('nrCorrect', nrCorrectAnswered + 1)
                    } else {
                        event.target.setAttribute('colorTo', "btn-danger");
                    }
                }
            }

        }
        window.addEventListener('click', onClick);
    }

    

    </script>

</body>
